<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+US+Trad+Guides&family=Science+Gothic:wght@100..900&family=Tirra:wght@400;500;600;700;800;900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body>                                                  
    <nav>
        <p>COUNTDOWN TIMER</p>
    </nav>

    <div class="main">
        <div class="timer">0</div>
        <div class="setTimer">
            <input type="number" id="seconds" placeholder="Enter seconds" style="text-align: center;" />
            <button class="setter">Set Timer</button>
        </div>
    </div>



    <script src="script.js"></script>
</body>
</html>
